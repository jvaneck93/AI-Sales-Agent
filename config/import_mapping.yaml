# Kolomtoewijzing voor de bron-CSV.
# Links: veld in dit systeem. Rechts: kolomkop in de CSV.
# Pas alleen de rechterkant aan als de export andere kolomnamen heeft.
delimiter: ";"
encoding: utf-8-sig
columns:
  name: Bedrijfsnaam
  kvk_number: KvK-nummer
  legal_form: Rechtsvorm
  address: Adres
  city: Plaats
  sector: Sector
  website: Website
  phone: Telefoon
  email: E-mail
  # Optioneel: één contactpersoon per regel. Meerdere contactpersonen bij één
  # bedrijf mogen als extra regels met hetzelfde KvK-nummer.
  contact_name: Contactpersoon
  contact_role: Functie
  contact_phone: Telefoon contactpersoon
  contact_email: E-mail contactpersoon

# Kolomtoewijzing voor de aparte voertuigen-CSV (één voertuig per regel).
vehicle_columns:
  kvk_number: KvK-nummer
  license_plate: Kenteken
  make: Merk
  model: Model
  build_year: Bouwjaar
  ownership: Koop of lease
  lease_company: Leasemaatschappij
  contract_end_date: Einddatum contract
